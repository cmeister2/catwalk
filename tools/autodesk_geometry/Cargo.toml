[package]
name = "catwalk-autodesk-geometry"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Experimental pure Rust Autodesk BRep thumbnail bridge"

[workspace]
exclude = [".upstream"]

[dependencies]
catwalk = { path = "../.." }
cadmpeg-core = { path = ".upstream/crates/cadmpeg-core", default-features = false }
cadmpeg-ir = { path = ".upstream/crates/cadmpeg-ir", default-features = false }
cadmpeg-codec-f3d = { path = ".upstream/crates/cadmpeg-codec-f3d", default-features = false }
cadmpeg-codec-inventor = { path = ".upstream/crates/cadmpeg-codec-inventor", default-features = false }
cadmpeg-codec-step = { path = ".upstream/crates/cadmpeg-codec-step", default-features = false }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"

[dev-dependencies]
cfb = "=0.15.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[[bin]]
name = "autodesk-preview"
path = "src/main.rs"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[patch.crates-io]
hdf5-reader = { path = "../../vendor/hdf5-reader" }
ogeom-io = { path = "../../vendor/ogeom-io" }
