name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check warnings
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --locked
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify publishable crate
        shell: bash
        run: |
          cargo package --locked
          archive="target/package/$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name == "catwalk3d") | "\(.name)-\(.version).crate"')"
          test "$(stat --format=%s "$archive")" -lt 10000000
          tar -tzf "$archive" > target/package/contents.txt
          if rg -v '^catwalk3d-[^/]+/(src/|docs/|examples/|tests/|README\.md$|LICENSE$|Cargo\.toml(\.orig)?$|Cargo\.lock$|\.cargo_vcs_info\.json$)' target/package/contents.txt \
            || rg '/(node_modules|\.env(\.[^/]+)?)(/|$)' target/package/contents.txt; then
            echo 'Unexpected files in the crate archive.' >&2
            exit 1
          fi
      - name: Check runtime geometry and compression backends
        shell: bash
        run: |
          for platform in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            cargo tree --locked --target "$platform" --edges normal,build --prefix none > "target/runtime-$platform.txt"
            if rg '^(zstd-sys|zstd-safe|libz-sys|libz-ng-sys|hdf5-sys|netcdf-sys|assimp-sys|vtk-sys|occt-sys|bzip2-sys|cmake|bindgen|cc) v' "target/runtime-$platform.txt"; then
              echo 'A native geometry or compression build dependency entered the runtime graph.' >&2
              exit 1
            fi
          done

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: catwalk-tests
      - name: Test without a display server
        if: runner.os == 'Linux'
        run: env -u DISPLAY -u WAYLAND_DISPLAY -u XDG_RUNTIME_DIR cargo test --all-targets --locked
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --all-targets --locked
      - name: Build gallery from tested images
        if: runner.os == 'Linux'
        run: cargo run --locked --example gallery -- --report target/format-snapshots --output target/gallery
      - name: Retain snapshot comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-snapshots-${{ runner.os }}
          path: target/format-snapshots
          if-no-files-found: warn
          retention-days: 14
      - name: Retain gallery preview
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-gallery
          path: target/gallery
          retention-days: 14

  success:
    name: Success
    if: always()
    needs: [checks, tests, gallery]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          GALLERY_RESULT: ${{ needs.gallery.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$GALLERY_RESULT" = success

  gallery:
    needs: [checks, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Download verified Linux gallery
        uses: actions/download-artifact@v4
        with:
          name: thumbnail-gallery
          path: target/gallery
      - name: Configure GitHub Pages
        if: github.event.repository.private == false && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event.repository.private == false && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/gallery

  pages:
    if: github.event.repository.private == false && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: gallery
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified gallery
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: success
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: crates-io-release
      cancel-in-progress: false
    env:
      CARGO_PUBLISH_READY: ${{ secrets.CARGO_REGISTRY_TOKEN != '' || secrets.PUBLISH_SECRET != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Publish crate and GitHub release
        if: env.CARGO_PUBLISH_READY == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.PUBLISH_SECRET }}
        run: npm run release
      - name: Await registry secret
        if: env.CARGO_PUBLISH_READY != 'true'
        run: echo 'Add CARGO_REGISTRY_TOKEN (or PUBLISH_SECRET) to repository secrets to enable automatic publication.'
