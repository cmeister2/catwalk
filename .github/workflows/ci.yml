name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check warnings
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --locked
      - name: Check runtime geometry and compression backends
        shell: bash
        run: |
          for platform in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc; do
            cargo tree --locked --target "$platform" --edges normal,build --prefix none > "target/runtime-$platform.txt"
            if rg '^(zstd-sys|zstd-safe|libz-sys|libz-ng-sys|hdf5-sys|netcdf-sys|assimp-sys|vtk-sys|occt-sys|bzip2-sys|cmake|bindgen|cc) v' "target/runtime-$platform.txt"; then
              echo 'A native geometry or compression build dependency entered the runtime graph.' >&2
              exit 1
            fi
          done

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: catwalk-tests
      - name: Test without a display server
        if: runner.os == 'Linux'
        run: env -u DISPLAY -u WAYLAND_DISPLAY -u XDG_RUNTIME_DIR cargo test --all-targets --locked
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --all-targets --locked
      - name: Build gallery from tested images
        if: runner.os == 'Linux'
        run: cargo run --locked --example gallery -- --report target/format-snapshots --output target/gallery
      - name: Retain snapshot comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-snapshots-${{ runner.os }}
          path: target/format-snapshots
          if-no-files-found: warn
          retention-days: 14
      - name: Retain gallery preview
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-gallery
          path: target/gallery
          retention-days: 14

  autodesk-geometry:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/autodesk-geometry
      CATWALK_AUTODESK_ARTIFACTS: ${{ github.workspace }}/target/autodesk-geometry-snapshots
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare pinned experimental geometry decoder
        run: bash tools/autodesk_geometry/bootstrap.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/autodesk_geometry -> ../../target/autodesk-geometry
          key: autodesk-geometry
      - name: Check experimental tool formatting
        run: cargo fmt --manifest-path tools/autodesk_geometry/Cargo.toml -p catwalk-autodesk-geometry -- --check
      - name: Check experimental tool warnings
        run: cargo clippy --manifest-path tools/autodesk_geometry/Cargo.toml --locked --all-targets -- -D warnings
      - name: Check experimental tool documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path tools/autodesk_geometry/Cargo.toml -p catwalk-autodesk-geometry --no-deps --document-private-items --locked
      - name: Test fresh solid previews and image snapshots
        run: env -u DISPLAY -u WAYLAND_DISPLAY -u XDG_RUNTIME_DIR cargo test --manifest-path tools/autodesk_geometry/Cargo.toml --locked --all-targets
      - name: Record and check runtime compression backends
        shell: bash
        run: |
          cargo tree --manifest-path tools/autodesk_geometry/Cargo.toml --locked --edges normal,build --prefix none > target/autodesk-geometry-dependencies.txt
          if rg '^(zstd-sys|zstd-safe|libz-sys|libz-ng-sys|cmake|bindgen|cc) v' target/autodesk-geometry-dependencies.txt; then
            echo 'A native model or compression build dependency entered the experimental tool.' >&2
            exit 1
          fi
      - name: Retain experimental image comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodesk-geometry-snapshots
          path: |
            target/autodesk-geometry-snapshots
            target/autodesk-geometry-dependencies.txt
            tools/autodesk_geometry/evidence/outputs
          if-no-files-found: warn
          retention-days: 14

  gallery:
    needs: [checks, tests, autodesk-geometry]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Download verified Linux gallery
        uses: actions/download-artifact@v4
        with:
          name: thumbnail-gallery
          path: target/gallery
      - name: Configure GitHub Pages
        if: github.event.repository.private == false && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event.repository.private == false && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/gallery

  pages:
    if: github.event.repository.private == false && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: gallery
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified gallery
        id: deployment
        uses: actions/deploy-pages@v4
