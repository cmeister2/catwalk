name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check warnings
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test release configuration
        run: npm run test:release
      - name: Verify publishable crate
        shell: bash
        run: |
          cargo package --locked
          archive="target/package/$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name == "catwalk3d") | "\(.name)-\(.version).crate"')"
          test "$(stat --format=%s "$archive")" -lt 10000000
          tar -tzf "$archive" > target/package/contents.txt
          if rg -v '^catwalk3d-[^/]+/(src/|docs/|examples/|README\.md$|LICENSE$|Cargo\.toml(\.orig)?$|Cargo\.lock$|\.cargo_vcs_info\.json$)' target/package/contents.txt \
            || rg '/(tests|fixtures|snapshots|node_modules|\.env(\.[^/]+)?)(/|$)' target/package/contents.txt; then
            echo 'Unexpected files in the crate archive.' >&2
            exit 1
          fi
          cargo test --manifest-path "${archive%.crate}/Cargo.toml" --lib --locked --target-dir target
      - name: Check runtime geometry and compression backends
        shell: bash
        run: |
          for platform in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            cargo tree --locked --target "$platform" --edges normal,build --prefix none > "target/runtime-$platform.txt"
            if rg '^(zstd-sys|zstd-safe|libz-sys|libz-ng-sys|hdf5-sys|netcdf-sys|assimp-sys|vtk-sys|occt-sys|bzip2-sys|cmake|bindgen|cc) v' "target/runtime-$platform.txt"; then
              echo 'A native geometry or compression build dependency entered the runtime graph.' >&2
              exit 1
            fi
          done

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: catwalk-tests
      - name: Test without a display server
        if: runner.os == 'Linux'
        run: env -u DISPLAY -u WAYLAND_DISPLAY -u XDG_RUNTIME_DIR cargo test --all-targets --locked
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --all-targets --locked
      - name: Build gallery from tested images
        if: runner.os == 'Linux'
        run: cargo run --locked --example gallery -- --report target/format-snapshots --output target/gallery
      - name: Retain snapshot comparisons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: format-snapshots-${{ runner.os }}
          path: target/format-snapshots
          if-no-files-found: warn
          retention-days: 14
      - name: Retain gallery preview
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: thumbnail-gallery
          path: target/gallery
          retention-days: 14

  success:
    name: Success
    if: always()
    needs: [checks, tests, gallery, release-plan, prepare-binaries, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          GALLERY_RESULT: ${{ needs.gallery.result }}
          PLAN_RESULT: ${{ needs.release-plan.result }}
          PREPARE_RESULT: ${{ needs.prepare-binaries.result }}
          BINARIES_RESULT: ${{ needs.binaries.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$GALLERY_RESULT" = success
          test "$PLAN_RESULT" = success || test "$PLAN_RESULT" = skipped
          test "$PREPARE_RESULT" = success
          test "$BINARIES_RESULT" = success

  release-plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      releasing: ${{ steps.plan.outputs.releasing }}
      commit: ${{ steps.plan.outputs.commit }}
      rust-version: ${{ steps.plan.outputs.rust-version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Plan version and prepare manifests
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/release/plan.mjs --release
      - name: Retain planned manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-plan
          path: release-prepared
          if-no-files-found: error

  prepare-binaries:
    needs: release-plan
    if: ${{ always() && !cancelled() && (needs.release-plan.result == 'success' || needs.release-plan.result == 'skipped') }}
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ needs.release-plan.outputs.version || steps.ci-plan.outputs.version }}
      releasing: ${{ needs.release-plan.outputs.releasing || steps.ci-plan.outputs.releasing }}
      commit: ${{ needs.release-plan.outputs.commit || steps.ci-plan.outputs.commit }}
      rust-version: ${{ needs.release-plan.outputs.rust-version || steps.ci-plan.outputs.rust-version }}
      matrix: ${{ needs.release-plan.outputs.matrix || steps.ci-plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ needs.release-plan.outputs.rust-version || 'stable' }}
          components: rust-docs
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-notices
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read CI version
        if: needs.release-plan.result == 'skipped'
        id: ci-plan
        run: node .github/release/plan.mjs --ci
      - name: Download planned manifests
        if: needs.release-plan.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-plan
          path: release-prepared
      - name: Apply prepared manifests
        run: cp release-prepared/Cargo.toml release-prepared/Cargo.lock .
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-about@0.9.2
      - name: Prepare archive documentation
        run: cp README.md LICENSE release-prepared/
      - name: Generate runtime license notices
        run: node .github/release/notices.mjs --output release-prepared
      - name: Retain prepared binary inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-prepared
          path: release-prepared
          if-no-files-found: error

  binaries:
    needs: prepare-binaries
    if: ${{ always() && !cancelled() && needs.prepare-binaries.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-binaries.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: ${{ matrix.musl && '-C target-feature=+crt-static -C link-self-contained=yes -C linker=rust-lld' || contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
      CATWALK_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/target/release-snapshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ needs.prepare-binaries.outputs.rust-version }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download prepared manifests and notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binary-prepared
          path: release-prepared
      - name: Apply prepared manifests
        run: cp release-prepared/Cargo.toml release-prepared/Cargo.lock .
      - name: Compile release executable
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" --bin catwalk
      - name: Compare thumbnails using the release executable
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --release --locked --target "$TARGET" --test format_snapshots
      - name: Package and test extracted executable
        env:
          TARGET: ${{ matrix.target }}
        run: node .github/release/package.mjs "$TARGET"
      - name: Retain release archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-binary-${{ matrix.target }}
          path: release-assets
          if-no-files-found: error
      - name: Retain release snapshot comparisons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-snapshots-${{ matrix.target }}
          path: target/release-snapshots
          if-no-files-found: warn

  gallery:
    needs: [checks, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Download verified Linux gallery
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: thumbnail-gallery
          path: target/gallery
      - name: Configure GitHub Pages
        if: github.event.repository.private == false && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload GitHub Pages artifact
        if: github.event.repository.private == false && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/gallery

  pages:
    if: github.event.repository.private == false && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: gallery
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified gallery
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare-binaries.outputs.releasing == 'true'
    needs: [success, prepare-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: crates-io-release
      cancel-in-progress: false
    env:
      CARGO_PUBLISH_READY: ${{ secrets.CARGO_REGISTRY_TOKEN != '' || secrets.PUBLISH_SECRET != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ needs.prepare-binaries.outputs.rust-version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download verified release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-binary-*
          path: release-assets
          merge-multiple: true
      - name: Publish crate and GitHub release
        if: env.CARGO_PUBLISH_READY == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.PUBLISH_SECRET }}
        run: npm run release
      - name: Await registry secret
        if: env.CARGO_PUBLISH_READY != 'true'
        run: echo 'Add CARGO_REGISTRY_TOKEN (or PUBLISH_SECRET) to repository secrets to enable automatic publication.'
