# Binary notices cover the normal dependency graph for every release target.
# Apache-2.0 is preferred where upstream explicitly offers a license choice. Mandatory
# AND terms remain included by cargo-about's SPDX expression evaluation.
accepted = [
    "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "CC0-1.0", "IJG", "Unicode-3.0", "MPL-2.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
ignore-transitive-dependencies = false

# These files have real copyright text that SPDX synthesis did not preserve.
# Packaged files are preferred; git is used only for files omitted by upstream.
