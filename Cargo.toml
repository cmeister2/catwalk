[package]
name = "catwalk3d"
version = "0.1.0"
edition = "2024"
description = "Headless model thumbnails rendered entirely in Rust"
license = "MIT"
repository = "https://github.com/cmeister2/catwalk3d"
homepage = "https://cmeister2.github.io/catwalk3d/"
documentation = "https://docs.rs/catwalk3d"
readme = "README.md"
include = [
    "/src/**",
    "/docs/**",
    "/README.md",
    "/LICENSE",
    "/examples/demo.rs",
    "/examples/models/gear.obj",
    "/examples/gear.png",
    "/Cargo.toml",
    "/Cargo.lock",
]

[[bin]]
name = "catwalk"
path = "src/main.rs"

[dependencies]
acadrust = { version = "=0.6.4", default-features = false }
base64 = "0.23.0"
cadmpeg-codec-f3d = "=0.6.1"
cadmpeg-codec-inventor = "=0.6.1"
cadmpeg-codec-step = "=0.6.1"
cadmpeg-core = "=0.6.1"
cadmpeg-ir = "=0.6.1"
cfb = { version = "=0.15.0", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
dicom-object = { version = "=0.10.0", default-features = false, features = ["deflate"] }
dicom-core = "=0.10.0"
dicom-pixeldata = { version = "=0.10.0", default-features = false, features = ["native", "image"] }
draco-core = { version = "=2.3.2", default-features = false, features = ["decoder", "point_cloud_decode", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
earcutr = "0.5.0"
fbxcel = { version = "=0.9.0", default-features = false, features = ["tree"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extensions", "KHR_materials_unlit"] }
hdf5-reader = { version = "=0.9.1", default-features = false, features = ["lz4"] }
las = { version = "0.11.1", default-features = false, features = ["laz"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std"] }
openusd = { version = "=0.8.0", default-features = false }
openusd-schemas = { version = "=0.8.0", default-features = false, features = ["geom", "shade"] }
netcdf-reader = { version = "=0.9.1", default-features = false, features = ["netcdf4"] }
ndarray = "=0.17.2"
num-bigint = "=0.4.8"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
ogeom-io = { version = "=0.9.16", default-features = false }
ogeom-mesh = { version = "=0.9.16", default-features = false }
ogeom-core = { version = "=0.9.16", default-features = false }
ogeom-doc = { version = "=0.9.16", default-features = false }
ogeom-geom = { version = "=0.9.16", default-features = false }
ogeom-intersect = { version = "=0.9.16", default-features = false }
ogeom-math = { version = "=0.9.16", default-features = false }
ogeom-topo = { version = "=0.9.16", default-features = false }
ogeom-algo = { version = "=0.9.16", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tga", "hdr", "webp", "exr", "tiff"] }
png = "0.18.1"
roxmltree = "0.21.1"
rmp = "=0.8.14"
rmpv = "=1.3.1"
ruzstd = "0.9.0"
serde_json = "1.0.151"
sha2 = "=0.11.0"
tiff = "=0.11.3"
truck-stepio = "0.3.0"
truck-meshalgo = { version = "0.4.0", default-features = false, features = ["tessellation"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
hdf5-writer = { version = "=0.9.1", default-features = false }
netcdf-writer = { version = "=0.9.1", default-features = false, features = ["netcdf4"] }
truck-modeling = "=0.6.0"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

